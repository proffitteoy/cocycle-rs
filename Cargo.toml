[package]
name = "cocycle"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Topological data analysis in pure Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Aequiludium/cocycle-rs"
homepage = "https://github.com/Aequiludium/cocycle-rs"
documentation = "https://github.com/Aequiludium/cocycle-rs/tree/main/docs"
keywords = ["tda", "topology", "homology", "persistence"]
categories = ["mathematics", "science"]
publish = ["crates-io"]
include = [
  "/src/**", "/tests/**", "/examples/**", "/benches/rips.rs", "/assets/*.svg",
  "/docs/**/*.md", "/Cargo.toml", "/Cargo.lock", "/README.md",
  "/CHANGELOG.md", "/CONTRIBUTING.md", "/LICENSE",
]

[[bench]]
name = "rips"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(cocycle_distance_bench)'] }

[dependencies]
