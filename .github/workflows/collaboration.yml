name: Collaboration documents

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'collaboration/**'
      - '.github/PULL_REQUEST_TEMPLATE/collaboration.md'
      - '.github/workflows/collaboration.yml'
      - 'tools/check_docs.py'
      - 'tools/check_source.py'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'collaboration/**'
      - '.github/PULL_REQUEST_TEMPLATE/collaboration.md'
      - '.github/workflows/collaboration.yml'
      - 'tools/check_docs.py'
      - 'tools/check_source.py'

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python tools/check_source.py
      - run: python collaboration/check.py
