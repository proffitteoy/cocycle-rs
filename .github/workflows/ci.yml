name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint and docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python tools/check_source.py
      - run: python tools/check_artifacts.py
      - run: python tools/check_docs.py
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - run: rustfmt --edition 2024 --check tools/diagram_dump.rs tools/benchmark_driver.rs benches/native/cocycle.rs tools/reference/rips_cocycle.rs tools/reference/sparse_cocycle.rs benches/pipeline/cocycle.rs benches/distances/cocycle.rs
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --locked
      - run: rustdoc --edition 2024 --test README.md --extern cocycle=target/debug/libcocycle.rlib -L dependency=target/debug/deps
      - run: rustdoc --edition 2024 --test docs/guides/rips.md --extern cocycle=target/debug/libcocycle.rlib -L dependency=target/debug/deps
      - run: rustdoc --edition 2024 --test docs/guides/rips-construction.md --extern cocycle=target/debug/libcocycle.rlib -L dependency=target/debug/deps
      - run: rustdoc --edition 2024 --test docs/guides/rips-representatives.md --extern cocycle=target/debug/libcocycle.rlib -L dependency=target/debug/deps
      - run: rustdoc --edition 2024 --test docs/guides/sparse-rips.md --extern cocycle=target/debug/libcocycle.rlib -L dependency=target/debug/deps
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --all-features
      - run: cargo test --locked --release --all-features
      - run: cargo run --locked --example square
      - run: cargo run --locked --example rips_graph
      - run: cargo run --locked --example flag_persistence
      - run: cargo run --locked --example rips_sphere
      - run: cargo run --locked --example rips_representatives
      - run: cargo run --locked --example sparse_rips
      - run: cargo run --locked --example diagram_distances

  msrv:
    name: Minimum Rust (1.91)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.91.0
      - run: cargo test --locked --all-features
      - run: cargo check --locked --all-targets --all-features

  package:
    name: Package and packaged example
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package --locked
      - run: cargo run --locked --manifest-path target/package/cocycle-0.1.0/Cargo.toml --example square

  reference:
    name: Native C++ reference comparisons
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7.0.1
        with:
          repository: GUDHI/gudhi-devel
          ref: cba915e3ab8e1f5b1fe26eb44b407285f7af4e78
          path: target/native-sources/gudhi
          sparse-checkout: |
            src/common
            src/Simplex_tree
            src/Persistent_cohomology
            src/Rips_complex
            src/Collapse
            src/Subsampling
            src/Spatial_searching
      - uses: actions/checkout@v7.0.1
        with:
          repository: Ripser/ripser
          ref: 01add51ff64aaf40889483260cc5c3b7d0f2a1e7
          path: target/native-sources/ripser
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: Record reference run identity
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          fields = ("GITHUB_SHA", "GITHUB_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_REPOSITORY")
          Path("target/reference-run.json").write_text(json.dumps({key: os.environ.get(key) for key in fields}, indent=2) + "\n")
          PY
      - run: python tools/benchmark_native.py --quick --samples 1 --output target/native-smoke
      - run: python tools/compare_rips.py --output target/rips-reference
      - run: python tools/compare_sparse_rips.py --output target/sparse-rips-reference
      - run: python tools/benchmark_rips_pipeline.py --quick --samples 1 --output target/rips-pipeline-smoke
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: native-reference-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/reference-run.json
            target/native-smoke/environment.json
            target/native-smoke/results.json
            target/native-smoke/summary.csv
            target/native-smoke/manifest-at-measurement.toml
            target/native-smoke/fixtures/
            target/native-smoke/build/build.json
            target/native-smoke/build/build.log
            target/rips-reference/environment.json
            target/rips-reference/summary.json
            target/rips-reference/results.json
            target/rips-reference/fixtures/
            target/rips-reference/build/build.log
            target/sparse-rips-reference/environment.json
            target/sparse-rips-reference/summary.json
            target/sparse-rips-reference/results.json
            target/sparse-rips-reference/fixtures/
            target/sparse-rips-reference/build/build.log
            target/rips-pipeline-smoke/environment.json
            target/rips-pipeline-smoke/summary.json
            target/rips-pipeline-smoke/results.json
            target/rips-pipeline-smoke/measurements.json
            target/rips-pipeline-smoke/fixtures/
            target/rips-pipeline-smoke/build/build.log

  distances:
    name: Native diagram-distance references
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7.0.1
        with:
          repository: proffitteoy/Topp
          ref: ffa1da051ca7ac5e313c74cc9fb92a2bcb20c234
          path: target/native-sources/topp
      - uses: actions/checkout@v7.0.1
        with:
          repository: GUDHI/gudhi-devel
          ref: 4ec34ac55e6d2e8cfd7c322e84c1b0a56d516d51
          path: target/native-sources/gudhi-distance
      - run: sudo apt-get update && sudo apt-get install -y libcgal-dev libboost-dev
      - run: python -m pip install gudhi==3.11.0 numpy==2.4.6 POT==0.9.6.post1
      - run: python tools/compare_distances.py --quick --output target/distance-reference
      - run: python tools/benchmark_distances.py --quick --samples 1 --groups baseline arena --families uniform sparse --sizes 8 32 --output target/distance-smoke
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: distance-reference-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/distance-reference/environment.json
            target/distance-reference/results.json
            target/distance-reference/summary.json
            target/distance-reference/fixtures/
            target/distance-reference/build/build.json
            target/distance-reference/build/build.log
            target/distance-smoke/environment.json
            target/distance-smoke/results.json
            target/distance-smoke/summary.json
            target/distance-smoke/measurements.json
            target/distance-smoke/fixtures/
            target/distance-smoke/build/build.json
            target/distance-smoke/build/build.log
